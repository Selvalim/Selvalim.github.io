name: Get Citation Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - google_scholar_crawler/**
      - .github/workflows/google_scholar_crawler.yaml
permissions:
  contents: write
concurrency:
  group: scholar-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch public Scholar profile
        run: python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: qN8hC60AAAAJ
          OUTPUT_DIR: ${{ runner.temp }}/scholar-data
      - name: Publish successful snapshot
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/google-scholar-stats; then
            git switch -C google-scholar-stats origin/google-scholar-stats
          else
            git switch --orphan google-scholar-stats
          fi
          cp "$RUNNER_TEMP/scholar-data/gs_data.json" gs_data.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Scholar citation data'
            git push origin HEAD:google-scholar-stats
          fi
